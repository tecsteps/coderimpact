<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Coding agents write the code; understand it here. A lightweight IDE in your browser for GitHub repositories and local folders: definitions, callers, AI explanations and quick edits. Nothing to install." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171a1e" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CoderImpact" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:title" content="CoderImpact" />
    <meta property="og:description" content="A lightweight IDE in your browser, for humans who want to understand code." />
    <meta property="og:image" content="https://coderimpact.com/icon-512.png" />
    <title>CoderImpact</title>
    <script>
      // Apply the saved app appearance before first paint to avoid a flash.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("ci.settings") || "{}");
          var a = s.appearance || "system";
          var dark = a === "dark" || (a === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          console.warn("Could not apply the saved appearance", e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
